<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<style>body{margin:0;background:#e9e6e1;font-family:system-ui,sans-serif}a{color:#1a1a1a}a:hover{color:#555}</style>
</helmet>
<div style="padding:40px 44px;">
<div style="font:600 13px/1.2 system-ui;color:#1a1a1a;margin-bottom:6px;">Larissa G. · mobile (390 × 844)</div>
<div style="font:400 12px/1.4 system-ui;color:#666;margin-bottom:24px;">Cada tela é a página real, rolada até um ponto diferente. Dá para rolar dentro de cada uma.</div>
<div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start;">
<sc-for list="{{ shots }}" as="s" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;gap:10px;">
<div style="font:600 11px/1 ui-monospace,Menlo,monospace;color:#1a1a1a;">{{ s.label }}</div>
<div style="width:390px;height:844px;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 0 0 10px #111,0 20px 50px rgba(0,0,0,.25);">
<iframe src="Larissa G.dc.html" data-y="{{ s.y }}" onLoad="{{ onLoad }}" title="{{ s.label }}" style="width:390px;height:844px;border:0;display:block;"></iframe>
</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  onLoad = ev => {
    const f = ev.currentTarget, spec = f.dataset.y;
    const run = () => {
      try {
        const d = f.contentDocument, w = f.contentWindow;
        if (!d.querySelector('[data-retrato]')) return setTimeout(run, 300);
        d.documentElement.style.scrollBehavior = 'auto';
        const vh = w.innerHeight, L = vh * 1.1;
        const top = id => d.getElementById(id).getBoundingClientRect().top + w.scrollY;
        let y = 0;
        if (spec.startsWith('shot')) y = +spec.slice(4) * L + 2;
        else if (spec === 'strip') y = top('trabalhos') + (d.getElementById('trabalhos').offsetHeight - vh) * .42;
        else y = top(spec);
        w.scrollTo(0, y);
      } catch (e) {}
    };
    setTimeout(run, 900);
  };
  renderVals() {
    return {
      onLoad: this.onLoad,
      shots: [
        { label: 'Abertura', y: 'shot0' },
        { label: 'Retrato · Olhar', y: 'shot1' },
        { label: 'Retrato · Gel', y: 'shot3' },
        { label: 'Trabalhos', y: 'strip' },
        { label: 'Serviços', y: 'servicos' },
        { label: 'Agendar', y: 'agendar' }
      ]
    };
  }
}
</script>
</body>
</html>
